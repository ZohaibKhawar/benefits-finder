  "up to {amount}": "jusqu'à {amount}"
  "years old": "ans"
  "{count} children": "{count} enfants"
  "Ask": "Demander"
  "Ask about your results": "Posez une question sur vos résultats"
  "For example: why can't I get the Canada Workers Benefit?": "Par exemple : pourquoi n'ai-je pas droit à l'Allocation canadienne pour les travailleurs?"
  "If you type a question on your results page, that question and a short summary of your results are sent to Anthropic, the company that makes the Claude AI, to write one answer. Your name and contact details are never included, because we never ask for them. We don't store the question or the answer.": "Si vous posez une question sur votre page de résultats, cette question et un court résumé de vos résultats sont envoyés à Anthropic, l'entreprise qui crée l'IA Claude, pour rédiger une réponse. Votre nom et vos coordonnées ne sont jamais inclus, puisque nous ne les demandons jamais. Nous ne gardons ni la question ni la réponse."
  "Please keep your question under 500 characters.": "Votre question doit faire moins de 500 caractères."
  "The helper can't answer that one. Try asking about a benefit on your list.": "L'assistant ne peut pas répondre à cette question. Essayez de poser une question sur une prestation de votre liste."
  "The helper has answered a lot of questions recently. Try again later.": "L'assistant a répondu à beaucoup de questions récemment. Réessayez plus tard."
  "The helper is busy right now. Try again in a minute.": "L'assistant est occupé en ce moment. Réessayez dans une minute."
  "The helper isn't working right now. Your results above are still correct.": "L'assistant ne fonctionne pas en ce moment. Vos résultats ci-dessus restent valables."
  "To keep costs down, the site counts how many questions each visitor asks in an hour. That count is kept in memory only and forgotten after an hour.": "Pour limiter les coûts, le site compte le nombre de questions posées par chaque visiteur en une heure. Ce compte est gardé en mémoire seulement et oublié après une heure."
  "Type a question first.": "Écrivez d'abord une question."
  "We couldn't reach the helper. Try again in a minute.": "Nous n'avons pas pu joindre l'assistant. Réessayez dans une minute."
  "Written by AI from your results. It can make mistakes; the official pages have the final word.": "Rédigé par une IA à partir de vos résultats. Elle peut se tromper; les pages officielles ont le dernier mot."
  "Your question": "Votre question"
  "Your question and a summary of these results (no name or contact details) go to Anthropic's Claude AI for one answer. We don't keep them.": "Votre question et un résumé de ces résultats (sans nom ni coordonnées) sont envoyés à l'IA Claude d'Anthropic pour une réponse. Nous ne les gardons pas."

  # Privacy, legal and usability additions (2026-10-19)
  "Anthropic is in the United States, so your question is handled there and is subject to US law. Anthropic may keep it for a limited time under its own privacy policy.": "Anthropic est aux États-Unis : votre question y est traitée et est soumise aux lois américaines. Anthropic peut la garder pendant une période limitée selon sa propre politique de confidentialité."
  "Because we keep nothing, there's nothing about you for us to show, correct or delete.": "Comme nous ne gardons rien, nous n'avons aucun renseignement sur vous à montrer, à corriger ou à supprimer."
  "Don't type your name, Social Insurance Number or anything else that identifies you.": "N'écrivez pas votre nom, votre numéro d'assurance sociale ni rien d'autre qui permet de vous identifier."
  "Enter the month like 2025-03.": "Entrez le mois comme ceci : 2025-03."
  "Last updated October 19, 2026.": "Dernière mise à jour : 19 octobre 2026."
  "Likely: you seem to meet the rules. Maybe: it depends on something we didn't ask. Not yet: you can apply later.": "Probable : vous semblez remplir les conditions. Possible : cela dépend d'un élément que nous n'avons pas demandé. Pas encore : vous pourrez faire une demande plus tard."
  "Like every website, our web host keeps a standard access log for a limited time: your IP address, the time, the page address and your browser type. It never includes your answers. It's used only to keep the site running and safe.": "Comme pour tout site Web, notre hébergeur garde pendant une période limitée un journal d'accès standard : votre adresse IP, l'heure, l'adresse de la page et votre type de navigateur. Il ne contient jamais vos réponses. Il sert seulement à faire fonctionner le site et à le protéger."
  "Questions or complaints about privacy, or a mistake on the site: write to {email}.": "Pour une question ou une plainte sur la confidentialité, ou une erreur sur le site, écrivez à {email}."
  "Report a mistake": "Signaler une erreur"
  "That month hasn't happened yet. Enter the month you arrived.": "Ce mois n'est pas encore arrivé. Entrez le mois de votre arrivée."
  "To show your results, the questions ask about your province or territory, age, status in Canada, school, housing, family, income, health coverage and disability. Some of this is sensitive, so we use it only to build your results page.": "Pour afficher vos résultats, les questions portent sur votre province ou territoire, votre âge, votre statut au Canada, vos études, votre logement, votre famille, votre revenu, votre couverture santé et une éventuelle situation de handicap. Certains de ces renseignements sont sensibles : nous les utilisons seulement pour créer votre page de résultats."
  "We check every amount against official sources, but rules change and we can make mistakes. You use the site at your own risk: go by the official page before you apply or decide anything.": "Nous vérifions chaque montant auprès des sources officielles, mais les règles changent et nous pouvons faire des erreurs. Vous utilisez le site à vos propres risques : fiez-vous à la page officielle avant de faire une demande ou de prendre une décision."
  "What others can see": "Ce que d'autres peuvent voir"
  "What we collect and why": "Ce que nous recueillons et pourquoi"
  "You can also complain to the Office of the Privacy Commissioner of Canada.": "Vous pouvez aussi porter plainte auprès du Commissariat à la protection de la vie privée du Canada."
  "Your first day living in Canada, as year and month (like 2025-03).": "Votre premier jour comme résident du Canada, en année et en mois (comme 2025-03)."
  "Your rights and questions": "Vos droits et vos questions"
  "A study permit of a year or more that shows a Nunavut address qualifies. Shorter permits don't.": "Un permis d'études d'un an ou plus qui indique une adresse au Nunavut est admissible. Les permis plus courts ne le sont pas."
  "Across Canada": "Partout au Canada"
  "Apply as soon as you arrive, with your immigration papers and proof of your NWT address. The health office tells you the date your coverage starts.": "Faites la demande dès votre arrivée, avec vos documents d'immigration et une preuve de votre adresse aux TNO. Le bureau de santé vous indique la date de début de votre couverture."
  "Apply as soon as you arrive. Coverage usually starts on the first day of the third month, so get private insurance until then.": "Faites la demande dès votre arrivée. La couverture commence habituellement le premier jour du troisième mois : prenez une assurance privée d'ici là."
  "Canada Student Loans and Grants are based on need. The Yukon Grant is only for students who went to high school in the Yukon or grew up there, and lived there for the 2 years before classes.": "Les prêts et bourses d'études canadiens sont fondés sur les besoins. La subvention du Yukon (Yukon Grant) est réservée aux étudiants qui ont fait leur secondaire au Yukon ou qui y ont grandi, et qui y ont vécu les 2 années avant le début des cours."
  "Everyone living in the territories can claim it. It lowers the tax you owe.": "Tous les habitants des territoires peuvent la demander. Elle réduit l'impôt à payer."
  "Families with income above $22,065 get part of it.": "Les familles dont le revenu dépasse 22 065 $ en reçoivent une partie."
  "Families with income above $35,000 get part of it.": "Les familles dont le revenu dépasse 35 000 $ en reçoivent une partie."
  "Northwest Territories": "Territoires du Nord-Ouest"
  "Nunavut": "Nunavut"
  "People on a study permit should call the Health Services Administration Office (1-800-661-0830) to check. A permit of a year or more with an NWT address usually qualifies.": "Les titulaires d'un permis d'études doivent appeler le Bureau d'administration des services de santé (1-800-661-0830) pour vérifier. Un permis d'un an ou plus avec une adresse aux TNO est habituellement admissible."
  "Register as soon as you arrive: coverage starts after a 3-month wait, and applying late can push the start date back. Buy private health insurance for those 3 months.": "Inscrivez-vous dès votre arrivée : la couverture commence après une attente de 3 mois, et une demande tardive peut repousser la date de début. Prenez une assurance maladie privée pour ces 3 mois."
  "The Northwest Territories and Nunavut run their own student aid, so the federal grant isn't paid there.": "Les Territoires du Nord-Ouest et le Nunavut gèrent leur propre aide financière aux études, alors la bourse fédérale n'y est pas versée."
  "The Yukon doesn't cover people on a study permit. Get a student or private health plan.": "Le Yukon ne couvre pas les titulaires d'un permis d'études. Prenez un régime étudiant ou une assurance privée."
  "You need to have lived in Nunavut for 12 months before you apply.": "Vous devez avoir vécu au Nunavut pendant 12 mois avant de faire la demande."
  "You need to have lived in the NWT for 12 months in a row before your program starts.": "Vous devez avoir vécu aux TNO pendant 12 mois de suite avant le début de votre programme."
  "You need to have lived in the North for 6 months in a row.": "Vous devez avoir vécu dans le Nord pendant 6 mois de suite."
  "Yukon": "Yukon"

benefits:
  cgeb:
    name: "Allocation canadienne pour l'épicerie et les besoins essentiels"
    also_called: "crédit pour la TPS/TVH"
    summary: "De l'argent non imposable versé tous les 3 mois aux personnes à revenu faible ou modeste. Elle a remplacé le crédit pour la TPS/TVH en juillet 2026 et est 25 % plus élevée jusqu'en 2031."
    how_to_get: "Produisez votre déclaration de revenus chaque année, même sans revenu. Nouvel arrivant? Faites la demande maintenant avec le formulaire Web RC151 (ou le RC66 si vous avez des enfants), sans attendre votre première déclaration."
  cwb:
    name: "Allocation canadienne pour les travailleurs"
    summary: "Un crédit d'impôt remboursable pour les personnes qui travaillent et gagnent un faible revenu. Une partie peut être versée d'avance pendant l'année."
    how_to_get: "Demandez-la à l'annexe 6 quand vous produisez votre déclaration. Le logiciel d'impôt la remplit pour vous."
    note: "Les montants sont ceux de l'année d'imposition 2025. Ceux de la déclaration de 2026 (produite au printemps 2027) seront un peu plus élevés."
  ccb:
    name: "Allocation canadienne pour enfants"
    summary: "De l'argent non imposable versé chaque mois pour chaque enfant de moins de 18 ans. La plus importante prestation pour la plupart des familles."
    how_to_get: "Faites la demande à la naissance de votre enfant ou à votre arrivée au Canada (formulaire RC66 pour les nouveaux arrivants). Les deux parents doivent produire une déclaration chaque année pour continuer à la recevoir."
  cdcp:
    name: "Régime canadien de soins dentaires"
    summary: "Une couverture dentaire du gouvernement pour les personnes sans assurance dentaire dont le revenu familial est inférieur à 90 000 $. Gratuit sous 70 000 $; quote-part de 40 % ou 60 % entre 70 000 $ et 90 000 $."
    how_to_get: "Faites la demande en ligne ou par téléphone après avoir produit votre déclaration de revenus. Vous devez confirmer chaque année que vous n'avez pas d'assurance dentaire."
  dtc:
    name: "Crédit d'impôt pour personnes handicapées"
    summary: "Un crédit d'impôt pour les personnes ayant un handicap de longue durée. À lui seul, il réduit votre impôt, mais il donne aussi accès à la Prestation canadienne pour les personnes handicapées, à des bourses d'études supplémentaires et au régime enregistré d'épargne-invalidité (REEI)."
    how_to_get: "Demandez à un médecin ou à une infirmière praticienne de remplir le formulaire T2201, puis envoyez-le à l'ARC."
  cdb:
    name: "Prestation canadienne pour les personnes handicapées"
    summary: "Jusqu'à environ 204 $ par mois pour les personnes de 18 à 64 ans qui ont le crédit d'impôt pour personnes handicapées. Elle diminue quand le revenu augmente."
    how_to_get: "Obtenez d'abord le crédit d'impôt pour personnes handicapées, produisez vos déclarations, puis faites la demande auprès de Service Canada."
  student_grant:
    name: "Bourse d'études canadienne"
    summary: "De l'argent pour le collège et l'université que vous n'avez pas à rembourser : jusqu'à 4 200 $ par année pour les étudiants à temps plein et 2 520 $ à temps partiel, plus des montants pour les étudiants ayant un handicap ou des enfants."
    how_to_get: "Il n'y a pas de demande séparée : vous l'obtenez en demandant l'aide financière aux études de votre province (le RAFEO en Ontario). Le Québec a son propre programme."
  tuition_credit:
    name: "Crédit d'impôt pour frais de scolarité"
    summary: "15 % des frais de scolarité payés sont déduits de votre impôt fédéral. Si vous ne devez pas encore d'impôt, il est reporté sans limite de temps, ou jusqu'à 5 000 $ peuvent être transférés à un parent ou à un grand-parent. Les étudiants étrangers peuvent aussi le demander."
    how_to_get: "Téléchargez votre feuillet T2202 sur le portail étudiant de votre établissement et inscrivez-le dans votre déclaration. Les étudiants peuvent aussi déduire leurs frais de déménagement s'ils ont déménagé de 40 km ou plus pour un emploi ou un emploi d'été."
  training_credit:
    name: "Crédit canadien pour la formation"
    summary: "Pour les travailleurs de 25 à 64 ans : un solde qui augmente de 250 $ par année (jusqu'à 5 000 $) et rembourse jusqu'à la moitié de vos frais de scolarité."
    how_to_get: "Votre avis de cotisation indique votre solde. Demandez-le avec vos frais de scolarité dans votre déclaration."
  rap:
    name: "Programme d'aide au remboursement"
    summary: "Si vous remboursez des prêts étudiants et que votre revenu est faible, votre paiement peut tomber à 0 $. La partie fédérale des prêts étudiants est sans intérêt."
    how_to_get: "Faites la demande sur le site du Centre de service national de prêts aux étudiants. Renouvelez la demande tous les 6 mois."
  clb:
    name: "Bon d'études canadien"
    summary: "Jusqu'à 2 000 $ pour les études après le secondaire, pour les enfants nés en 2004 ou après dans des familles à faible revenu. Aucun dépôt requis. Beaucoup de gens ne le demandent jamais."
    how_to_get: "Ouvrez un REEE à une banque (beaucoup sont sans frais) et demandez le Bon d'études canadien. Les adultes de 18 à 20 ans peuvent le demander eux-mêmes avant leurs 21 ans. À partir d'avril 2028, le gouvernement ouvrira automatiquement un REEE pour les enfants admissibles nés en 2024 ou après."
  ifhp:
    name: "Programme fédéral de santé intérimaire"
    summary: "Une couverture santé pour les demandeurs d'asile et les personnes protégées qui n'ont pas encore d'assurance-maladie provinciale. Les visites chez le médecin et à l'hôpital sont gratuites. Depuis mai 2026, il y a des frais de 4 $ par ordonnance et une part de 30 % pour les soins dentaires, la vue et le counseling."
    how_to_get: "Il commence automatiquement avec votre demande d'asile. Montrez votre document du PFSI à la clinique."
  settlement:
    name: "Services d'établissement gratuits pour les nouveaux arrivants"
    summary: "De l'aide gratuite pour l'emploi, les cours de langue, le logement et les formalités, offerte par des organismes d'établissement. Les résidents permanents de la catégorie économique peuvent les utiliser pendant 6 ans après leur arrivée (5 ans à partir d'avril 2027). Certaines provinces, dont l'Ontario, financent aussi des organismes qui aident les résidents temporaires."
    how_to_get: "Cherchez « services d'établissement près de chez moi » sur le site d'IRCC ou composez le 211."
  tax_clinic:
    name: "Comptoirs d'impôts gratuits"
    summary: "Des bénévoles produisent votre déclaration gratuitement si votre revenu est modeste et votre situation fiscale simple (environ 40 000 $ ou moins pour une personne, 55 000 $ pour deux)."
    how_to_get: "Trouvez un comptoir sur le site de l'ARC. La plupart ont lieu de février à avril; certains sont ouverts toute l'année."
  help_211:
    name: "211"
    summary: "Appelez ou textez le 2-1-1, ou cherchez en ligne, pour trouver des banques alimentaires, de l'aide au logement, des cliniques juridiques et tout service local. Gratuit, jour et nuit, dans plus de 150 langues."
    how_to_get: "Composez le 2-1-1 ou visitez 211.ca."
  aid_office:
    name: "Le bureau d'aide financière de votre établissement"
    summary: "Chaque collège et université a des bourses, des fonds d'urgence et de l'aide alimentaire qui n'apparaissent pas sur les sites du gouvernement. Renseignez-vous directement."
    how_to_get: "Cherchez « aide financière » ou « bourse » sur le site de votre établissement."
  oeptc:
    name: "Crédit d'impôt de l'Ontario pour les coûts d'énergie et les impôts fonciers"
    also_called: "partie de la Prestation Trillium de l'Ontario"
    summary: "De l'argent versé chaque mois pour aider à payer le loyer ou l'impôt foncier et l'énergie. 20 % du loyer payé compte dans le calcul. Une résidence étudiante ne compte que pour 25 $."
    how_to_get: "Remplissez le formulaire ON-BEN (demande de Prestation Trillium de l'Ontario) avec votre déclaration et inscrivez le loyer payé et votre adresse. Chaque colocataire demande le loyer qu'il a payé."
  noec:
    name: "Crédit pour les coûts d'énergie dans le Nord de l'Ontario"
    also_called: "partie de la Prestation Trillium de l'Ontario"
    summary: "Un montant supplémentaire pour les personnes du Nord de l'Ontario qui paient un loyer ou de l'impôt foncier, pour les coûts plus élevés du chauffage et de l'énergie dans le Nord."
    how_to_get: "Remplissez le formulaire ON-BEN avec votre déclaration et indiquez que vous vivez dans le Nord de l'Ontario."
  ostc:
    name: "Crédit de taxe de vente de l'Ontario"
    also_called: "partie de la Prestation Trillium de l'Ontario"
    summary: "Jusqu'à 378 $ par année pour vous, votre conjoint et chaque enfant, versés chaque mois avec la Prestation Trillium de l'Ontario."
    how_to_get: "Produisez votre déclaration de revenus. L'ARC le calcule pour vous, sans formulaire séparé."
  ocb:
    name: "Prestation ontarienne pour enfants"
    summary: "Jusqu'à 146,66 $ par mois pour chaque enfant de moins de 18 ans, versés avec l'Allocation canadienne pour enfants."
    how_to_get: "La demande d'Allocation canadienne pour enfants vous y inscrit aussi."
    note: "Le taux de réduction de 8 % vient des années précédentes et doit encore être vérifié."
  liwtc:
    name: "Crédit d'impôt de l'Ontario pour les travailleurs à faible revenu"
    also_called: "crédit LIFT"
    summary: "Réduit l'impôt de l'Ontario que vous devez jusqu'à 850 $ si vous travaillez et gagnez moins d'environ 38 500 $. Il n'aide que si vous devez de l'impôt en Ontario; il n'est pas versé en argent."
    how_to_get: "Le logiciel d'impôt le demande pour vous sur le formulaire ON428-A."
  care_credit:
    name: "Crédit d'impôt de l'Ontario pour la garde d'enfants (ASGE)"
    summary: "Si vous payez des frais de garde, l'Ontario vous en rembourse une partie sous forme de crédit remboursable (familles dont le revenu va jusqu'à environ 150 000 $). Vérifiez aussi si votre garderie participe au programme à frais réduits : les frais y sont plafonnés à 22 $ par jour."
    how_to_get: "Gardez vos reçus de frais de garde et déduisez ces frais dans votre déclaration de revenus."
  osap:
    name: "RAFEO (Régime d'aide financière aux étudiantes et étudiants de l'Ontario)"
    summary: "Des bourses et des prêts pour le collège, l'université et certaines formations. Depuis le 1er août 2026, la plus grande partie de l'aide de l'Ontario est un prêt; les étudiants des collèges privés d'enseignement professionnel ne reçoivent que des prêts de l'Ontario. La bourse fédérale reste de l'argent gratuit."
    how_to_get: "Faites la demande sur le site du RAFEO. Les nouveaux demandeurs doivent d'abord suivre un module de 15 minutes. Essayez l'outil d'estimation du RAFEO pour voir un montant avant de faire la demande."
  learn_and_stay:
    name: "Subvention Étudier et rester en Ontario"
    summary: "Les frais de scolarité, les livres et les coûts sont entièrement payés pour certains programmes de soins infirmiers, de soins paramédicaux et de laboratoire médical dans le Nord, l'Est et le Sud-Ouest de l'Ontario, si vous acceptez de travailler ensuite dans cette région."
    how_to_get: "Faites la demande par le RAFEO. Vérifiez que votre établissement et votre programme sont sur la liste admissible."
  ohip:
    name: "Assurance-santé de l'Ontario (OHIP)"
    summary: "Les soins médicaux et hospitaliers gratuits. Il n'y a plus de délai d'attente."
    how_to_get: "Rendez-vous en personne à un centre ServiceOntario avec 3 documents originaux : un pour votre statut au Canada, un pour votre adresse en Ontario et un pour votre identité."
  ohip_plus:
    name: "Assurance-santé Plus (médicaments gratuits pour les 24 ans et moins)"
    summary: "Médicaments sur ordonnance gratuits pour toute personne de 24 ans ou moins qui a l'OHIP et aucune assurance médicaments privée. Aucune inscription : montrez votre carte santé à la pharmacie."
    how_to_get: "Montrez votre carte santé avec votre ordonnance. Si vous avez une assurance de l'école ou du travail, elle paie en premier."
  healthy_smiles:
    name: "Beaux sourires Ontario"
    summary: "Des soins dentaires gratuits pour les enfants de 17 ans et moins des familles à faible revenu."
    how_to_get: "Faites la demande en ligne ou par la poste. Les enfants qui reçoivent Ontario au travail ou le POSPH sont inscrits automatiquement."
  ontario_works:
    name: "Ontario au travail"
    summary: "De l'argent chaque mois pour la nourriture et le loyer (jusqu'à 733 $ par mois pour une personne) et de l'aide pour trouver un emploi, si vous ne pouvez pas payer vos besoins de base."
    how_to_get: "Faites la demande en ligne ou au bureau des services sociaux de votre ville."
  odsp:
    name: "Programme ontarien de soutien aux personnes handicapées (POSPH)"
    summary: "De l'argent chaque mois pour les personnes ayant un handicap et un besoin financier : jusqu'à 1 436 $ par mois pour une personne à partir de juillet 2026."
    how_to_get: "Faites la demande en ligne ou à votre bureau local du POSPH. Vous aurez besoin de formulaires médicaux."
  oesp:
    name: "Programme ontarien d'aide relative aux frais d'électricité"
    summary: "Un crédit mensuel d'environ 35 $ à 75 $ (plus avec le chauffage électrique) sur votre facture d'électricité, pour les ménages à faible revenu. Seulement si la facture est à votre nom."
    how_to_get: "Faites la demande en ligne sur ontarioelectricitysupport.ca. L'aide dure 2 ans, puis vous refaites la demande."
  cohb:
    name: "Allocation Canada-Ontario pour le logement"
    summary: "Une aide mensuelle pour payer le loyer. Dans la plupart des villes, on ne peut pas faire la demande directement : elle est offerte à partir de la liste d'attente pour un logement social."
    how_to_get: "Inscrivez-vous sur la liste d'attente pour un logement social de votre ville et continuez de produire vos déclarations de revenus."
  obpap:
    name: "Programme d'aide aux participants aux programmes relais de l'Ontario"
    summary: "Jusqu'à 5 000 $ pour les frais de scolarité, les livres et l'équipement d'un programme relais pour les personnes formées à l'étranger."
    how_to_get: "Faites la demande au bureau d'aide financière de l'établissement qui offre votre programme relais, d'ici le 31 mars."
  better_jobs:
    name: "Meilleurs emplois Ontario"
    summary: "Jusqu'à 28 000 $ (ou 35 000 $ pour les programmes de plus d'un an) pour une formation si vous avez été mis à pied ou êtes sans emploi depuis un certain temps, y compris jusqu'à 500 $ par semaine pour les frais de subsistance."
    how_to_get: "Communiquez avec un centre d'Emploi Ontario; on vous aidera à faire la demande."
  toronto_fair_pass:
    name: "Fair Pass (rabais de la TTC)"
    summary: "Des trajets moins chers sur la TTC pour les Torontois à faible revenu de 20 à 64 ans : 2,10 $ par trajet au lieu de 3,30 $, et un plafond mensuel des tarifs à partir de septembre 2026."
    how_to_get: "Faites la demande en ligne avec le numéro de votre carte PRESTO. Les personnes qui reçoivent Ontario au travail ou le POSPH sont vérifiées automatiquement."
  toronto_welcome_policy:
    name: "Welcome Policy (crédit pour les loisirs de Toronto)"
    summary: "Un crédit annuel pour les programmes de loisirs de la Ville de Toronto : natation, patinage, conditionnement physique, camps. Environ 683 $ pour les enfants et les jeunes jusqu'à 24 ans, et 315 $ pour les adultes."
    how_to_get: "Faites la demande en ligne ou par téléphone avec votre avis de cotisation. Renouvelez chaque année."
  ottawa_equipass:
    name: "ÉquiLaissez-passer (rabais d'OC Transpo)"
    summary: "Un laissez-passer mensuel à 58,25 $, ou 1,75 $ par trajet, pour les résidents d'Ottawa à faible revenu familial."
    how_to_get: "Faites la demande avec le formulaire ÉquiLaissez-passer d'OC Transpo et votre avis de cotisation. Chaque personne a besoin de sa propre carte PRESTO."
  peel_affordable_transit:
    name: "Programme de transport abordable (MiWay et Brampton Transit)"
    summary: "Des tarifs PRESTO à moitié prix pour les résidents de Mississauga, Brampton et Caledon à faible revenu, et des laissez-passer mensuels MiWay à moitié prix."
    how_to_get: "Faites la demande en ligne auprès de la Région de Peel avec votre avis de cotisation et une carte PRESTO enregistrée."
  hamilton_fare_assist:
    name: "Fare Assist (rabais de la HSR)"
    summary: "Environ 30 % de rabais sur les tarifs de la HSR pour les résidents de Hamilton à faible revenu familial, y compris les personnes qui reçoivent Ontario au travail ou le POSPH. Permanent depuis janvier 2026."
    how_to_get: "Faites la demande en ligne, par Ontario au travail ou au bureau du service à la clientèle de la HSR. Renouvelez chaque année."
  grt_affordable_transit:
    name: "Programme de transport abordable (Grand River Transit)"
    summary: "Un laissez-passer mensuel à 47 $ (55 % de rabais) ou des trajets à 1,35 $ pour les résidents à faible revenu de la région de Waterloo."
    how_to_get: "Faites la demande auprès de la Région de Waterloo sur grt.ca/ATP ou par téléphone."
  london_transit_pass:
    name: "Laissez-passer selon le revenu (London Transit)"
    summary: "Un laissez-passer mensuel réduit de London Transit (environ 72 $) pour les résidents de London de 18 ans et plus à faible revenu."
    how_to_get: "Faites la demande auprès de la Ville de London avec une preuve de revenu."
  bc_family_benefit:
    name: "Prestation familiale de la Colombie-Britannique"
    summary: "De l'argent non imposable chaque mois pour les familles ayant des enfants de moins de 18 ans, versé avec l'Allocation canadienne pour enfants. Jusqu'à 1 750 $ par année pour le premier enfant, plus 500 $ pour les familles monoparentales."
    how_to_get: "La demande d'Allocation canadienne pour enfants vous y inscrit. Les deux parents doivent produire une déclaration chaque année."
  bc_renter_credit:
    name: "Crédit d'impôt pour locataires de la C.-B."
    summary: "Jusqu'à 400 $ par année pour les locataires dont le revenu familial va jusqu'à environ 64 800 $. Le montant ne dépend pas du loyer payé."
    how_to_get: "Demandez-le dans votre déclaration de la C.-B. Vous devez avoir été locataire au moins 6 mois dans l'année."
  bc_msp:
    name: "Medical Services Plan (MSP)"
    summary: "L'assurance-maladie de la C.-B. : soins médicaux et hospitaliers. Les nouveaux arrivants attendent environ 3 mois, alors prenez une assurance privée en attendant."
    how_to_get: "Faites la demande en ligne dès votre arrivée en C.-B."
  bc_student_aid:
    name: "StudentAid BC"
    summary: "L'aide financière aux études de la C.-B. : des bourses à ne pas rembourser et des prêts sans intérêt pour le collège, l'université et certaines formations. Une seule demande couvre l'aide fédérale et celle de la C.-B."
    how_to_get: "Faites la demande en ligne sur StudentAid BC."
  bc_income_assistance:
    name: "Aide au revenu de la C.-B."
    summary: "De l'argent chaque mois pour la nourriture et le loyer, et de l'aide pour trouver un emploi, si vous ne pouvez pas payer vos besoins de base."
    how_to_get: "Faites la demande en ligne avec My Self Serve, ou composez le 1-866-866-0800."
  ab_child_family_benefit:
    name: "Prestation pour enfants et familles de l'Alberta"
    summary: "De l'argent non imposable pour les familles ayant des enfants de moins de 18 ans, versé quatre fois par année. Un montant de base (jusqu'à 1 529 $ pour le premier enfant) plus un montant pour les familles qui travaillent."
    how_to_get: "La demande d'Allocation canadienne pour enfants vous y inscrit. Produisez vos déclarations chaque année."
    note: "Les taux de 15 % pour la partie liée au travail viennent des années précédentes et doivent encore être vérifiés."
  ab_health:
    name: "Régime d'assurance-maladie de l'Alberta (AHCIP)"
    summary: "L'assurance-maladie de l'Alberta : soins médicaux et hospitaliers. Inscrivez-vous dans les 3 mois suivant votre arrivée."
    how_to_get: "Faites la demande dans un bureau d'agent d'immatriculation avec vos documents d'immigration et une preuve de votre adresse en Alberta."
  ab_student_aid:
    name: "Alberta Student Aid"
    summary: "L'aide financière aux études de l'Alberta : prêts, bourses et bourses d'excellence pour le collège, l'université et l'apprentissage. Une seule demande couvre l'aide fédérale et celle de l'Alberta."
    how_to_get: "Faites la demande en ligne sur Alberta Student Aid."
  ab_income_support:
    name: "Soutien du revenu de l'Alberta"
    summary: "De l'argent chaque mois pour les besoins de base si vous ne pouvez pas les payer, et de l'aide pour trouver un emploi."
    how_to_get: "Faites la demande en ligne, ou appelez le centre de contact Alberta Supports au 1-877-644-9992."
  sk_low_income_credit:
    name: "Crédit d'impôt pour personnes à faible revenu de la Saskatchewan"
    summary: "Jusqu'à 460 $ pour vous, 460 $ pour un conjoint et 181 $ par enfant (deux au maximum), versés avec l'allocation pour l'épicerie tous les 3 mois. Jusqu'à 1 282 $ par année par famille."
    how_to_get: "Produisez votre déclaration de revenus. L'ARC le calcule pour vous."
    note: "Le taux de réduction (environ 3 %) est calculé à partir de la fourchette de revenu officielle (39 345 $ à 81 668 $)."
  sk_health:
    name: "Carte santé de la Saskatchewan"
    summary: "L'assurance-maladie de la Saskatchewan : soins médicaux et hospitaliers. La couverture des nouveaux arrivants commence dans environ 3 mois."
    how_to_get: "Faites la demande en ligne par Saskatchewan Account dès votre arrivée."
  sk_student_aid:
    name: "Prêts étudiants de la Saskatchewan"
    summary: "L'aide financière aux études de la Saskatchewan : prêts et bourses pour le collège et l'université. Une seule demande couvre l'aide fédérale et provinciale."
    how_to_get: "Faites la demande en ligne par Saskatchewan Student Aid."
  sk_income_support:
    name: "Soutien du revenu de la Saskatchewan"
    summary: "De l'argent chaque mois pour la nourriture, le loyer et les autres besoins de base si vous ne pouvez pas les payer."
    how_to_get: "Faites la demande en ligne ou appelez le 1-866-221-5200."
  mb_renter_credit:
    name: "Crédit d'impôt pour l'abordabilité des loyers du Manitoba"
    summary: "Un crédit remboursable pour les locataires : 625 $ pour l'année d'imposition 2026 (575 $ pour 2025), avec un supplément pour les aînés."
    how_to_get: "Demandez-le dans votre déclaration du Manitoba (formulaire MB479) et gardez vos reçus de loyer."
  mb_rent_assist:
    name: "Allocation de logement (Rent Assist)"
    summary: "Une aide mensuelle au loyer pour les locataires à faible revenu qui ne reçoivent pas d'aide sociale. Elle couvre une partie de l'écart entre votre loyer et 30 % de votre revenu."
    how_to_get: "Faites la demande au programme Rent Assist du Manitoba. Essayez d'abord l'outil d'estimation en ligne."
  mb_health:
    name: "Carte santé du Manitoba"
    summary: "L'assurance-maladie du Manitoba : soins médicaux et hospitaliers. Les résidents permanents peuvent faire la demande dès leur arrivée."
    how_to_get: "Envoyez le formulaire d'inscription avec une preuve de votre statut et de votre adresse au Manitoba."
  mb_student_aid:
    name: "Aide aux étudiants du Manitoba"
    summary: "L'aide financière aux études du Manitoba : prêts, bourses et subventions pour le collège et l'université. Une seule demande couvre l'aide fédérale et celle du Manitoba."
    how_to_get: "Faites la demande en ligne sur le site d'Aide aux étudiants du Manitoba."
  mb_eia:
    name: "Programme d'aide à l'emploi et au revenu (EIA)"
    summary: "De l'argent chaque mois pour la nourriture et le loyer si vous ne pouvez pas payer vos besoins de base, plus l'allocation de logement."
    how_to_get: "Faites la demande en ligne ou dans un bureau EIA du Manitoba."
  qc_solidarity:
    name: "Crédit d'impôt pour solidarité"
    also_called: "solidarity tax credit"
    summary: "Le principal crédit du Québec pour les personnes à revenu faible ou modeste, versé chaque mois ou tous les 3 mois. Une partie dépend du fait de payer un loyer ou d'être propriétaire."
    how_to_get: "Produisez votre déclaration de revenus du Québec et remplissez l'annexe D. Inscrivez-vous au dépôt direct auprès de Revenu Québec."
  qc_family_allowance:
    name: "Allocation famille (Retraite Québec)"
    also_called: "family allowance"
    summary: "La prestation pour enfants du Québec : jusqu'à 3 068 $ par année par enfant de moins de 18 ans, plus jusqu'à 1 077 $ pour les familles monoparentales. Versée par Retraite Québec, pas par l'ARC."
    how_to_get: "Habituellement automatique quand une naissance est enregistrée au Québec. Les nouveaux arrivants font la demande à Retraite Québec."
  qc_work_premium:
    name: "Prime au travail"
    also_called: "work premium"
    summary: "Un crédit remboursable qui complète un faible revenu de travail, plus élevé pour les familles avec enfants."
    how_to_get: "Demandez-la dans votre déclaration de revenus du Québec (annexe P)."
  qc_ramq:
    name: "Assurance maladie du Québec (RAMQ)"
    summary: "L'assurance maladie du Québec. La plupart des nouveaux arrivants attendent jusqu'à 3 mois; les réfugiés, les personnes protégées et les enfants n'attendent pas."
    how_to_get: "Inscrivez-vous à la RAMQ dès votre arrivée, avec vos documents d'immigration et une preuve d'adresse."
  qc_afe:
    name: "Programme de prêts et bourses (AFE)"
    also_called: "Aide financière aux études"
    summary: "L'aide financière aux études du Québec. Une bonne partie est versée en bourses à ne pas rembourser. Le Québec a son propre programme au lieu de la Bourse d'études canadienne."
    how_to_get: "Faites la demande en ligne auprès de l'Aide financière aux études."
  qc_social_assistance:
    name: "Aide sociale"
    also_called: "social assistance"
    summary: "De l'argent chaque mois pour les besoins de base si vous ne pouvez pas les payer, et de l'aide pour retourner au travail."
    how_to_get: "Faites la demande en ligne ou dans un bureau de Services Québec."
  nb_child_tax_benefit:
    name: "Prestation fiscale pour enfants du Nouveau-Brunswick"
    summary: "250 $ par année par enfant pour les familles dont le revenu va jusqu'à 20 000 $ (moins au-delà), plus un supplément scolaire de 100 $ chaque juillet. Versée avec l'Allocation canadienne pour enfants."
    how_to_get: "La demande d'Allocation canadienne pour enfants vous y inscrit. Produisez vos déclarations chaque année."
  nb_hst_credit:
    name: "Crédit pour la taxe de vente harmonisée du Nouveau-Brunswick"
    summary: "Jusqu'à 300 $ pour vous, 300 $ pour un conjoint et 100 $ par enfant (300 $ pour le premier enfant d'une famille monoparentale), versés avec l'allocation pour l'épicerie."
    how_to_get: "Produisez votre déclaration de revenus. L'ARC le calcule pour vous."
  nb_medicare:
    name: "Assurance-maladie du Nouveau-Brunswick"
    summary: "L'assurance-maladie du Nouveau-Brunswick. Les nouveaux arrivants installés ici de façon permanente peuvent être couverts dès leur premier jour."
    how_to_get: "Faites la demande après votre arrivée, avec vos documents d'immigration et une preuve d'adresse. Le traitement peut prendre de 10 à 12 semaines."
  nb_student_aid:
    name: "Services financiers pour étudiants du Nouveau-Brunswick"
    summary: "L'aide financière aux études du Nouveau-Brunswick : prêts, bourses et subventions. Une seule demande couvre l'aide fédérale et provinciale."
    how_to_get: "Faites la demande en ligne auprès des Services financiers pour étudiants du Nouveau-Brunswick."
  nb_social_assistance:
    name: "Aide sociale du Nouveau-Brunswick"
    summary: "De l'argent chaque mois pour les besoins de base si vous ne pouvez pas les payer."
    how_to_get: "Appelez le 1-833-733-7835 ou rendez-vous à un bureau de Développement social."
  ns_child_benefit:
    name: "Prestation pour enfants de la Nouvelle-Écosse"
    summary: "127,08 $ par mois pour chaque enfant de moins de 18 ans pour les familles dont le revenu est inférieur à 26 000 $, et une partie jusqu'à 34 000 $. Versée avec l'Allocation canadienne pour enfants."
    how_to_get: "La demande d'Allocation canadienne pour enfants vous y inscrit. Produisez vos déclarations chaque année."
  ns_affordable_living:
    name: "Crédit d'impôt pour la vie abordable de la Nouvelle-Écosse"
    summary: "Jusqu'à 255 $ par année pour vous (ou vous et votre conjoint), plus 60 $ par enfant, versés avec l'allocation pour l'épicerie tous les 3 mois."
    how_to_get: "Produisez votre déclaration de revenus. L'ARC le calcule pour vous."
  ns_msi:
    name: "Carte santé de la Nouvelle-Écosse (MSI)"
    summary: "L'assurance-maladie de la Nouvelle-Écosse. Les résidents permanents qui arrivent de l'étranger sont couverts dès leur premier jour."
    how_to_get: "Faites la demande à MSI avec vos documents d'immigration et une preuve de votre adresse en Nouvelle-Écosse."
  ns_student_aid:
    name: "Aide aux étudiants de la Nouvelle-Écosse"
    summary: "L'aide financière aux études de la Nouvelle-Écosse : prêts et bourses pour le collège et l'université. Une seule demande couvre l'aide fédérale et provinciale."
    how_to_get: "Faites la demande en ligne sur le site d'Aide aux étudiants de la Nouvelle-Écosse."
  ns_income_assistance:
    name: "Aide au revenu de la Nouvelle-Écosse"
    summary: "De l'argent chaque mois pour les besoins de base si vous ne pouvez pas les payer, et de l'aide pour trouver un emploi."
    how_to_get: "Faites la demande en ligne ou appelez le 1-877-424-1177."
  pe_child_benefit:
    name: "Prestation pour enfants de l'Île-du-Prince-Édouard"
    summary: "34,16 $ par mois par enfant pour les familles dont le revenu est inférieur à 45 000 $, et 24,16 $ entre 45 000 $ et 80 000 $. Versée avec l'Allocation canadienne pour enfants."
    how_to_get: "La demande d'Allocation canadienne pour enfants vous y inscrit. Produisez vos déclarations chaque année."
  pe_essentials:
    name: "Prestation pour les besoins essentiels de l'Î.-P.-É."
    summary: "310 $ par année pour une personne seule ou 365 $ pour un couple ou une famille monoparentale, et au moins 175 $ pour tout le monde. Elle remplace le crédit de taxe de vente de l'Î.-P.-É."
    how_to_get: "Produisez votre déclaration de revenus. Elle est versée avec l'allocation pour l'épicerie tous les 3 mois."
  pe_health:
    name: "Carte santé de l'Î.-P.-É."
    summary: "L'assurance-maladie de l'Î.-P.-É. : soins médicaux et hospitaliers. Vous devez prévoir vivre à l'Î.-P.-É. au moins 6 mois et un jour."
    how_to_get: "Faites la demande en ligne avec vos documents d'immigration et une preuve de votre adresse à l'Î.-P.-É."
  pe_student_aid:
    name: "Services financiers aux étudiants de l'Î.-P.-É."
    summary: "L'aide financière aux études de l'Î.-P.-É. : prêts, bourses et subventions pour le collège et l'université."
    how_to_get: "Faites la demande en ligne auprès des Services financiers aux étudiants de l'Î.-P.-É."
  pe_social_assistance:
    name: "Aide sociale de l'Î.-P.-É."
    summary: "De l'argent chaque mois pour les besoins de base si vous ne pouvez pas les payer."
    how_to_get: "Appelez le 1-877-569-0546 ou rendez-vous à un bureau des programmes sociaux."
  nl_child_benefit:
    name: "Prestation pour enfants de Terre-Neuve-et-Labrador"
    summary: "Environ 157 $ à 193 $ par mois par enfant pour les familles à faible revenu, plus 150 $ par mois pour chaque enfant de moins de 5 ans (supplément nutritionnel). Versée avec l'Allocation canadienne pour enfants."
    how_to_get: "La demande d'Allocation canadienne pour enfants vous y inscrit. Produisez vos déclarations chaque année."
  nl_income_supplement:
    name: "Supplément de revenu de Terre-Neuve-et-Labrador"
    summary: "Jusqu'à 520 $ par année pour une personne, plus pour les couples, plus 231 $ par enfant. Versé avec l'allocation pour l'épicerie tous les 3 mois."
    how_to_get: "Produisez votre déclaration de revenus. L'ARC le calcule pour vous."
  nl_mcp:
    name: "Medical Care Plan (MCP)"
    summary: "L'assurance-maladie de Terre-Neuve-et-Labrador : soins médicaux et hospitaliers."
    how_to_get: "Faites la demande avec vos documents d'immigration et une preuve de votre adresse."
  nl_student_aid:
    name: "Aide financière aux étudiants de Terre-Neuve-et-Labrador"
    summary: "L'aide financière aux études de Terre-Neuve-et-Labrador : bourses et prêts pour le collège et l'université."
    how_to_get: "Faites la demande en ligne auprès de l'Aide financière aux étudiants."
  nl_income_support:
    name: "Soutien du revenu de Terre-Neuve-et-Labrador"
    summary: "De l'argent chaque mois pour les besoins de base si vous ne pouvez pas les payer."
    how_to_get: "Faites la demande en ligne ou appelez le 1-877-729-7888."
  northern_residents:
    name: "Déductions pour les habitants de régions éloignées"
    summary: "Tous les habitants du Yukon, des Territoires du Nord-Ouest et du Nunavut peuvent retrancher jusqu'à 11 $ par jour de leur revenu imposable, ou 22 $ par jour si personne d'autre dans leur logement ne la demande (jusqu'à 8 030 $ par année). Certains voyages payés par l'employeur comptent aussi."
    how_to_get: "Demandez-la avec le formulaire T2222 quand vous produisez votre déclaration de revenus. Vous devez d'abord avoir vécu dans le Nord pendant 6 mois de suite."
    note: "Les montants sont ceux de l'année d'imposition 2025."
  yt_child_benefit:
    name: "Prestation pour enfants du Yukon"
    summary: "80,50 $ par mois pour chaque enfant de moins de 18 ans pour les familles dont le revenu ne dépasse pas 35 000 $, et une partie au-delà. Versée avec l'Allocation canadienne pour enfants."
    how_to_get: "La demande d'Allocation canadienne pour enfants vous y inscrit. Produisez vos déclarations chaque année."
  yt_health:
    name: "Carte santé du Yukon"
    summary: "Le Régime d'assurance-santé du Yukon : soins médicaux et hospitaliers. Les nouveaux résidents attendent 3 mois avant le début de la couverture."
    how_to_get: "Inscrivez-vous en personne (4e étage, 204, rue Lambert à Whitehorse, ou auprès d'un agent territorial dans les autres collectivités) avec vos pièces d'identité, vos documents d'immigration et une preuve de votre adresse au Yukon."
  yt_student_aid:
    name: "Aide financière aux étudiants du Yukon"
    summary: "Le bureau du Yukon gère les prêts et bourses d'études canadiens pour les résidents du Yukon. Les étudiants à temps plein qui ont fait leur secondaire au Yukon (ou qui y ont grandi) peuvent aussi obtenir la subvention du Yukon : 195 $ par semaine d'études en 2026-2027, pendant jusqu'à 170 semaines."
    how_to_get: "Faites la demande sur le portail de l'Aide financière aux étudiants du Yukon. Demandez la subvention du Yukon dans les 6 semaines suivant le début des cours, puis chaque année scolaire."
  yt_social_assistance:
    name: "Aide sociale du Yukon"
    summary: "De l'argent pour la nourriture, les vêtements, les services publics et le logement si vous ne pouvez pas les payer. La plupart des personnes inscrites à un programme postsecondaire n'y ont pas droit."
    how_to_get: "Appelez le bureau d'aide sociale de votre collectivité pour prendre un rendez-vous d'accueil (Whitehorse : 867-667-5674)."
  nt_child_benefit:
    name: "Prestation pour enfants des Territoires du Nord-Ouest"
    summary: "Jusqu'à 815 $ par année pour un enfant de moins de 6 ans et 652 $ pour un enfant de 6 à 17 ans (un peu moins pour chaque enfant de plus), pour les familles dont le revenu ne dépasse pas 30 000 $. Elle diminue jusqu'à zéro à 80 000 $. Versée avec l'Allocation canadienne pour enfants."
    how_to_get: "La demande d'Allocation canadienne pour enfants vous y inscrit. Produisez vos déclarations chaque année."
  nt_health:
    name: "Carte d'assurance-maladie des TNO"
    summary: "Le Régime d'assurance-maladie des TNO : soins médicaux et hospitaliers. Les personnes qui arrivent d'une autre province attendent jusqu'au premier jour du troisième mois."
    how_to_get: "Envoyez la demande avec vos documents d'immigration (indiquant une adresse aux TNO) et deux documents qui prouvent que vous vivez aux TNO. Questions : 1-800-661-0830."
  nt_student_aid:
    name: "Aide financière aux étudiants des TNO"
    summary: "L'aide financière aux études propre aux TNO, à temps plein ou à temps partiel : un prêt pour les frais de subsistance qui peut être remis si vous vivez aux TNO après vos études, un prêt remboursable jusqu'à 1 400 $ par mois, et des bourses pour les droits de scolarité et les livres si vous êtes allé à l'école aux TNO."
    how_to_get: "Envoyez la demande par courriel (nwtsfa@gov.nt.ca). Vous pouvez faire la demande avant d'être accepté dans un programme."
  nt_income_assistance:
    name: "Aide au revenu des TNO"
    summary: "De l'argent chaque mois pour la nourriture, le logement et les services publics si vous ne pouvez pas les payer, pour les personnes de 19 ans et plus."
    how_to_get: "Faites la demande à votre centre de services d'ECE local avant la fin du mois pour lequel vous avez besoin d'aide."
  nu_child_benefit:
    name: "Prestation pour enfants du Nunavut"
    summary: "58 $ par mois pour chaque enfant de moins de 18 ans pour les familles dont le revenu ne dépasse pas 22 065 $, et une partie au-delà. Versée avec l'Allocation canadienne pour enfants."
    how_to_get: "La demande d'Allocation canadienne pour enfants vous y inscrit. Produisez vos déclarations chaque année."
  nu_health:
    name: "Carte d'assurance-maladie du Nunavut"
    summary: "Le Régime d'assurance-maladie du Nunavut : soins médicaux et hospitaliers, et aide pour les déplacements médicaux."
    how_to_get: "Envoyez la demande à nhip@gov.nu.ca avec deux pièces d'identité (dont vos documents d'immigration) et une lettre ou un contrat montrant que vous vivrez au Nunavut plus de 12 mois."
  nu_fans:
    name: "Aide financière aux étudiants du Nunavut (FANS)"
    summary: "L'aide financière aux études propre au Nunavut, à temps plein ou à temps partiel : les déplacements, jusqu'à 10 000 $ par année pour les droits de scolarité et 2 500 $ pour les livres, et les frais de subsistance. C'est une bourse pour les Inuit du Nunavut et un prêt qui peut être remis pour les autres étudiants."
    how_to_get: "Envoyez la demande FANS à fans@gov.nu.ca (1-877-860-0680) au moins 8 semaines avant la fin de votre programme, puis chaque année scolaire. Vous pouvez faire la demande avant d'être accepté."
  nu_income_assistance:
    name: "Aide au revenu du Nunavut"
    summary: "De l'aide pour les besoins de base pour les personnes de 18 ans et plus qui ne peuvent pas les payer, une fois les autres sources d'argent (comme l'assurance-emploi) utilisées."
    how_to_get: "Appelez votre bureau d'aide au revenu local pour prendre rendez-vous. Vous devez produire une déclaration de revenus chaque année."
