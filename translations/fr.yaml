  "You can apply after you file your first Canadian tax return.": "Vous pourrez faire la demande après avoir produit votre première déclaration de revenus canadienne."
  "You can now apply: {name}": "Vous pouvez maintenant faire une demande : {name}"
  "You have a disability and a low income.": "Vous avez un handicap et un faible revenu."
  "You have a drug plan through school, work or family, and that plan pays first.": "Vous avez une assurance médicaments par l'école, le travail ou la famille, et cette assurance paie en premier."
  "You have dental coverage through school, work or family, and that rules it out. Opting out of a plan doesn't make you eligible.": "Vous avez une assurance dentaire par l'école, le travail ou la famille, ce qui vous exclut. Se retirer d'un régime ne vous rend pas admissible."
  "You have the Disability Tax Credit. The amount goes down as income goes up.": "Vous avez le crédit d'impôt pour personnes handicapées. Le montant diminue quand le revenu augmente."
  "You live in Northern Ontario and pay rent or property tax.": "Vous vivez dans le Nord de l'Ontario et payez un loyer ou de l'impôt foncier."
  "You must be a resident for the whole year, so your first full year in Canada counts.": "Vous devez être résident toute l'année, alors c'est votre première année complète au Canada qui compte."
  "You need more than {amount} of income from work.": "Vous devez avoir plus de {amount} de revenu de travail."
  "You need the Disability Tax Credit first.": "Il vous faut d'abord le crédit d'impôt pour personnes handicapées."
  "You need to be 18 or older (or have a partner or child).": "Vous devez avoir 18 ans ou plus (ou avoir un conjoint ou un enfant)."
  "You need to be 18 or older.": "Vous devez avoir 18 ans ou plus."
  "You need to be 19 or older (or have a partner or child).": "Vous devez avoir 19 ans ou plus (ou avoir un conjoint ou un enfant)."
  "You need to be 19 or older on December 31, or live with a partner or child.": "Vous devez avoir 19 ans ou plus le 31 décembre, ou vivre avec un conjoint ou un enfant."
  "You need to be a resident for tax purposes.": "Vous devez être résident aux fins de l'impôt."
  "You need to be a resident of Canada for tax purposes all year.": "Vous devez être résident du Canada aux fins de l'impôt toute l'année."
  "You need to be a resident of Canada for tax purposes.": "Vous devez être résident du Canada aux fins de l'impôt."
  "You need to be a resident of Canada for tax purposes. Visitors usually aren't.": "Vous devez être résident du Canada aux fins de l'impôt. Les visiteurs ne le sont généralement pas."
  "You need to be {age} or older (or have a partner or child).": "Vous devez avoir {age} ans ou plus (ou avoir un conjoint ou un enfant)."
  "You need to pay rent or property tax in Northern Ontario.": "Vous devez payer un loyer ou de l'impôt foncier dans le Nord de l'Ontario."
  "You need to pay rent or property tax, or live in a student residence.": "Vous devez payer un loyer ou de l'impôt foncier, ou vivre dans une résidence étudiante."
  "You probably owe no tax yet, so the credit is saved for later years, or up to $5,000 can go to a parent or grandparent.": "Vous ne devez probablement pas encore d'impôt, alors le crédit est reporté aux années suivantes, ou jusqu'à 5 000 $ peuvent être transférés à un parent ou à un grand-parent."
  "You rent and have a lower income. The limit for one person is about {amount} a year.": "Vous êtes locataire et avez un revenu plus faible. La limite pour une personne est d'environ {amount} par année."
  "You rent and have a lower income. Wait lists are long, so join early.": "Vous êtes locataire et avez un revenu plus faible. Les listes d'attente sont longues, alors inscrivez-vous tôt."
  "You rent your home.": "Vous êtes locataire."
  "You were laid off or have been out of work for a while.": "Vous avez été mis à pied ou êtes sans emploi depuis un certain temps."
  "You're 24 or under with no private drug plan.": "Vous avez 24 ans ou moins et aucune assurance médicaments privée."
  "You're 25 to 64, you work, and you pay tuition.": "Vous avez de 25 à 64 ans, vous travaillez et vous payez des frais de scolarité."
  "You're covered by the Interim Federal Health Program until your claim is accepted.": "Vous êtes couvert par le Programme fédéral de santé intérimaire jusqu'à l'acceptation de votre demande."
  "You're in a bridge training program.": "Vous êtes dans un programme relais."
  "You're waiting for a decision": "Vous attendez une décision"
  "Your answers are sent to our server once, used to build your results page, and then thrown away. They aren't stored, logged or shared.": "Vos réponses sont envoyées une seule fois à notre serveur, servent à créer votre page de résultats, puis sont supprimées. Elles ne sont ni conservées, ni consignées, ni partagées."
  "Your answers never go in the web address, so they don't end up in your browser history.": "Vos réponses ne vont jamais dans l'adresse Web, alors elles ne se retrouvent pas dans l'historique de votre navigateur."
  "Your children may get {first} now and $100 a year after, up to {most} each.": "Vos enfants pourraient recevoir {first} maintenant et 100 $ par année ensuite, jusqu'à {most} chacun."
  "Your family income is above the limit for your family size.": "Votre revenu familial dépasse la limite pour la taille de votre famille."
  "Your family income is above the limit for your number of children.": "Votre revenu familial dépasse la limite pour votre nombre d'enfants."
  "Your family income is above the limit.": "Votre revenu familial dépasse la limite."
  "Your family income is under {amount}.": "Votre revenu familial est inférieur à {amount}."
  "Your income is above the limit for the rent you pay.": "Votre revenu dépasse la limite pour le loyer que vous payez."
  "Your income is above the limit.": "Votre revenu dépasse la limite."
