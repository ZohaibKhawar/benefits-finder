# French (Canada). Keys are the English text; values are the French.
# Program names follow the governments' own French names.
# Run `python -m finder.i18n_keys fr` to list anything missing.

text:
  "(opens in a new tab)": "(s'ouvre dans un nouvel onglet)"
  "1 child": "1 enfant"
  "6 to 17": "6 à 17 ans"
  "A free tax clinic can do it for you.": "Un comptoir d'impôts gratuit peut le faire pour vous."
  "A shelter, or no fixed address": "Un refuge, ou sans adresse fixe"
  "A student residence counts for only $25. Renting off campus counts for much more.": "Une résidence étudiante ne compte que pour 25 $. Un loyer hors campus compte beaucoup plus."
  "About": "À propos"
  "About 3 minutes. No sign-up. We don't save your answers.": "Environ 3 minutes. Aucune inscription. Nous ne gardons pas vos réponses."
  "About a year, in total": "Environ par année, au total"
  "About how much money came in last year?": "Combien d'argent avez-vous reçu l'an dernier, environ?"
  "About Claimable": "À propos de Claimable"
  "Add these dates to my calendar": "Ajouter ces dates à mon calendrier"
  "Add your partner's too. Rough numbers are fine. Enter 0 if you had none.": "Ajoutez aussi celui de votre conjoint. Des chiffres approximatifs suffisent. Inscrivez 0 si vous n'en avez pas eu."
  "After you file, apply for the Canadian Dental Care Plan.": "Après avoir produit votre déclaration, demandez le Régime canadien de soins dentaires."
  "Alberta": "Alberta"
  "Amounts are different in Alberta, Quebec and Nunavut, so we can't estimate it here.": "Les montants sont différents en Alberta, au Québec et au Nunavut, alors nous ne pouvons pas l'estimer ici."
  "Amounts change every January and July. Each benefit shows the date we last checked it.": "Les montants changent chaque janvier et chaque juillet. Chaque prestation indique la date de notre dernière vérification."
  "An apartment, a room, a basement": "Un appartement, une chambre, un sous-sol"
  "Answer a few questions and see the credits and benefits you might get as a student or newcomer, with a rough amount and the official link for each one.": "Répondez à quelques questions et voyez les crédits et prestations auxquels vous pourriez avoir droit comme étudiant ou nouvel arrivant, avec un montant approximatif et le lien officiel pour chacun."
  "Answer questions about your age, status in Canada, school, rent, family and income.": "Répondez à des questions sur votre âge, votre statut au Canada, vos études, votre loyer, votre famille et vos revenus."
  "Anyone in Canada can use it.": "Tout le monde au Canada peut l'utiliser."
  "Apply as soon as you arrive. You must plan to live on PEI for at least 6 months and a day.": "Faites la demande dès votre arrivée. Vous devez prévoir vivre à l'Î.-P.-É. au moins 6 mois et un jour."
  "Apply for the Canada Child Benefit with form RC66. The same form signs you up for the grocery benefit and the provincial child benefit.": "Demandez l'Allocation canadienne pour enfants avec le formulaire RC66. Le même formulaire vous inscrit à l'allocation pour l'épicerie et à la prestation provinciale pour enfants."
  "Apply for the Canada Groceries and Essentials Benefit with the RC151 web form. You don't have to wait for your first tax return.": "Demandez l'Allocation canadienne pour l'épicerie et les besoins essentiels avec le formulaire Web RC151. Vous n'avez pas à attendre votre première déclaration de revenus."
  "Apply for the Canadian Dental Care Plan.": "Demandez le Régime canadien de soins dentaires."
  "Apply for {name}.": "Faites une demande : {name}."
  "Apply for {name}. Bring your immigration papers and proof of address.": "Faites une demande : {name}. Apportez vos documents d'immigration et une preuve d'adresse."
  "Apply now with form RC66 (it covers your children too). You don't have to wait for your first tax return.": "Faites la demande maintenant avec le formulaire RC66 (il couvre aussi vos enfants). Vous n'avez pas à attendre votre première déclaration de revenus."
  "Apply now with the RC151 web form. You don't have to wait for your first tax return.": "Faites la demande maintenant avec le formulaire Web RC151. Vous n'avez pas à attendre votre première déclaration de revenus."
  "Apply with form RC66 (and RC66SCH). It also signs you up for the provincial child benefit.": "Faites la demande avec le formulaire RC66 (et le RC66ANN). Il vous inscrit aussi à la prestation provinciale pour enfants."
  "Are you a student?": "Êtes-vous aux études?"
  "Ask your doctor about the Disability Tax Credit (form T2201). It unlocks other help.": "Parlez à votre médecin du crédit d'impôt pour personnes handicapées (formulaire T2201). Il donne accès à d'autres aides."
  "At a career college, everything Ontario gives is a loan.": "Dans un collège privé d'enseignement professionnel, toute l'aide de l'Ontario est un prêt."
  "At your income you probably owe no provincial tax, so this wouldn't add anything.": "Avec votre revenu, vous ne devez probablement pas d'impôt provincial, alors ce crédit n'ajouterait rien."
  "Back": "Retour"
  "Before tax: jobs, tips, self-employment": "Avant impôt : emplois, pourboires, travail autonome"
  "Benefit amounts change every July. Check Claimable again.": "Les montants des prestations changent chaque juillet. Revenez vérifier sur Claimable."
  "British Columbia": "Colombie-Britannique"
  "Canadian citizen": "Citoyen canadien"
  "Change my answers": "Modifier mes réponses"
  "Check this answer.": "Vérifiez cette réponse."
  "Children on Ontario Works or ODSP are signed up automatically.": "Les enfants qui reçoivent Ontario au travail ou le POSPH sont inscrits automatiquement."
  "Common-law means you've lived together for at least 12 months, or you have a child together.": "Conjoint de fait veut dire que vous vivez ensemble depuis au moins 12 mois, ou que vous avez un enfant ensemble."
  "Coverage starts after a wait: the rest of the month you arrive plus two more months. Apply right away and buy private insurance for the gap.": "La couverture commence après une attente : le reste du mois de votre arrivée, plus deux mois. Faites la demande tout de suite et achetez une assurance privée en attendant."
  "Coverage starts when you arrive or when you're approved, whichever is later. Apply right away.": "La couverture commence à votre arrivée ou à l'approbation de votre demande, selon la date la plus tardive. Faites la demande tout de suite."
  "Coverage starts within about 3 months of arriving. Apply as soon as you arrive and get private insurance until it starts.": "La couverture commence dans environ 3 mois après votre arrivée. Faites la demande dès votre arrivée et prenez une assurance privée en attendant."
  "Cuts your provincial tax by up to {amount}. Tax software claims it for you.": "Réduit votre impôt provincial jusqu'à {amount}. Le logiciel d'impôt le demande pour vous."
  "Dental coverage": "Assurance dentaire"
  "Did you file a Canadian tax return last year?": "Avez-vous produit une déclaration de revenus canadienne l'an dernier?"
  "Do any of these apply to you?": "Est-ce que l'une de ces situations s'applique à vous?"
  "Do these first": "À faire en premier"
  "Do you have a disability or a long-term health condition?": "Avez-vous un handicap ou un problème de santé de longue durée?"
  "Do you have a spouse or common-law partner?": "Avez-vous un époux ou un conjoint de fait?"
  "Do you have children under 18 living with you?": "Avez-vous des enfants de moins de 18 ans qui vivent avec vous?"
  "Do you have health coverage through school, work or family?": "Avez-vous une assurance santé par l'école, le travail ou la famille?"
  "EI, pensions, support payments, taxable scholarships": "Assurance-emploi, pensions, pensions alimentaires, bourses imposables"
  "Each working partner can cut their provincial tax by up to {amount}, depending on how your income is split.": "Chaque conjoint qui travaille peut réduire son impôt provincial jusqu'à {amount}, selon la répartition de vos revenus."
  "Economic-class permanent residents can use them for 6 years after landing.": "Les résidents permanents de la catégorie économique peuvent les utiliser pendant 6 ans après leur arrivée."
  "Enter a number, like 12000.": "Inscrivez un nombre, par exemple 12000."
  "Enter your age.": "Inscrivez votre âge."
  "Estimated money a year": "Montant estimé par année"
  "Estimates for July 2026 to June 2027, based on what you told us. Real amounts depend on your tax return.": "Estimations pour juillet 2026 à juin 2027, selon vos réponses. Les vrais montants dépendent de votre déclaration de revenus."
  "Estimator": "Outil d'estimation"
  "Even with no income you get the base amount, as long as you file a tax return.": "Même sans revenu, vous recevez le montant de base, à condition de produire une déclaration de revenus."
  "Every benefit and its source": "Toutes les prestations et leurs sources"
  "Every credit, benefit and program Claimable checks, with the official link and the date we last checked it.": "Chaque crédit, prestation et programme que vérifie Claimable, avec le lien officiel et la date de notre dernière vérification."
  "Every school has its own bursaries and emergency money.": "Chaque établissement a ses propres bourses et fonds d'urgence."
  "Every year, people in Canada miss out on benefits they're owed, often because they never filed a tax return or didn't know a program existed.": "Chaque année, des gens au Canada passent à côté de prestations auxquelles ils ont droit, souvent parce qu'ils n'ont jamais produit de déclaration de revenus ou ne savaient pas qu'un programme existait."
  "Example: a 20-year-old student renting in Toronto, earning $9,000": "Exemple : une étudiante de 20 ans, locataire à Toronto, qui gagne 9 000 $"
  "Families with income above $20,397 get part of it.": "Les familles dont le revenu dépasse 20 397 $ en reçoivent une partie."
  "Families with income between $26,000 and $34,000 get part of it.": "Les familles dont le revenu se situe entre 26 000 $ et 34 000 $ en reçoivent une partie."
  "Family income must be under about {amount}.": "Le revenu familial doit être inférieur à environ {amount}."
  "Family income must be under {amount}.": "Le revenu familial doit être inférieur à {amount}."
  "Family net income must be {amount} or less for {children}.": "Le revenu familial net doit être de {amount} ou moins pour {children}."
  "Federal services are mostly for permanent residents, but some provinces fund agencies that help people on study and work permits.": "Les services fédéraux sont surtout pour les résidents permanents, mais certaines provinces financent des organismes qui aident les titulaires de permis d'études et de travail."
  "File even if you had no income. Most benefits only start after you file.": "Produisez-la même sans revenu. La plupart des prestations ne commencent qu'après."
  "File your {year} tax return by April 30, {deadline}, even if you had no income. Most of these benefits only start after you file.": "Produisez votre déclaration de revenus de {year} d'ici le 30 avril {deadline}, même si vous n'avez eu aucun revenu. La plupart de ces prestations ne commencent qu'après."
  "Fill in form ON-BEN for the Ontario Trillium Benefit and enter the rent you paid.": "Remplissez le formulaire ON-BEN pour la Prestation Trillium de l'Ontario et inscrivez le loyer que vous avez payé."
  "Find the benefits you're missing": "Trouvez les prestations qui vous échappent"
  "Follow your step-by-step plan. Every benefit links to its official government page.": "Suivez votre plan étape par étape. Chaque prestation renvoie à sa page officielle du gouvernement."
  "For example Ontario Works or ODSP": "Par exemple Ontario au travail ou le POSPH"
  "For lower-income residents. The limit for one person is about {amount} a year, and higher for bigger households.": "Pour les résidents à faible revenu. La limite pour une personne est d'environ {amount} par année, et plus élevée pour les ménages plus nombreux."
  "For students and newcomers anywhere in Canada. Answer 13 short questions and see the credits and benefits you might get, what each one is worth, and what to do first.": "Pour les étudiants et les nouveaux arrivants partout au Canada. Répondez à 13 courtes questions et voyez les crédits et prestations auxquels vous pourriez avoir droit, leur valeur et quoi faire en premier."
  "For your studies": "Pour vos études"
  "For {children}, with a family income of about {income}.": "Pour {children}, avec un revenu familial d'environ {income}."
  "Free help": "Aide gratuite"
  "From anything else": "De toute autre source"
  "From work": "Du travail"
  "Full-time students who studied more than {weeks} weeks in the year can't get it, unless they have a child living with them.": "Les étudiants à temps plein qui ont étudié plus de {weeks} semaines dans l'année n'y ont pas droit, sauf s'ils ont un enfant qui vit avec eux."
  "Get a Social Insurance Number (SIN) from Service Canada if you don't have one. You need it for every benefit.": "Obtenez un numéro d'assurance sociale (NAS) auprès de Service Canada si vous n'en avez pas. Il est nécessaire pour toutes les prestations."
  "Go to the home page": "Aller à la page d'accueil"
  "Government finders list programs, but they don't ask the questions that change the answer for students and newcomers, and they don't show amounts. This site does both, and gives you a plan in the right order.": "Les outils du gouvernement énumèrent des programmes, mais ne posent pas les questions qui changent la réponse pour les étudiants et les nouveaux arrivants, et n'affichent pas de montants. Ce site fait les deux et vous donne un plan dans le bon ordre."
  "Hamilton": "Hamilton"
  "Health and dental": "Santé et soins dentaires"
  "Health card waits differ: Ontario has none, while BC and Quebec make most newcomers wait about 3 months.": "Le délai pour la carte santé varie : l'Ontario n'en a aucun, alors que la C.-B. et le Québec font attendre la plupart des nouveaux arrivants environ 3 mois."
  "High school": "École secondaire"
  "How it works": "Comment ça fonctionne"
  "How old are you?": "Quel âge avez-vous?"
  "How to get it": "Comment l'obtenir"
  "How to get it:": "Comment l'obtenir :"
  "How we work out amounts": "Comment nous calculons les montants"
  "I get income assistance or disability assistance from my province": "Je reçois de l'aide sociale ou de l'aide aux personnes handicapées de ma province"
  "I own my home": "Je suis propriétaire"
  "I rent": "Je loue"
  "I study nursing, paramedic or medical lab": "J'étudie en soins infirmiers, soins paramédicaux ou laboratoire médical"
  "I was born here, or came more than 2 years ago": "Je suis né ici, ou je suis arrivé il y a plus de 2 ans"
  "I was laid off, or I've been out of work for 3 months or more": "J'ai été mis à pied, ou je suis sans emploi depuis 3 mois ou plus"
  "I'm in a bridging program for people trained in another country": "Je suis dans un programme relais pour les personnes formées à l'étranger"
  "I'm paying back student loans": "Je rembourse des prêts étudiants"
  "If money is tight": "Si l'argent manque"
  "If you can't cover food and rent right now.": "Si vous ne pouvez pas payer la nourriture et le loyer en ce moment."
  "If your condition seriously limits everyday activities (walking, seeing, thinking, and others) and will last a year or more, you may qualify. It unlocks other benefits.": "Si votre état limite beaucoup les activités de tous les jours (marcher, voir, penser, et autres) et va durer un an ou plus, vous pourriez y avoir droit. Il donne accès à d'autres prestations."
  "If your family had a low income while you were growing up, money may be waiting for you. You can claim it yourself until you turn 21.": "Si votre famille avait un faible revenu pendant votre enfance, de l'argent vous attend peut-être. Vous pouvez le demander vous-même jusqu'à vos 21 ans."
  "In Ontario, most provincial student aid is now a loan, not a grant (since August 1, 2026). The federal grant is still free.": "En Ontario, la plus grande partie de l'aide provinciale aux études est maintenant un prêt, pas une bourse (depuis le 1er août 2026). La bourse fédérale reste gratuite."
  "In Quebec, also file your Quebec tax return (TP-1) and fill in Schedule D for the solidarity tax credit.": "Au Québec, produisez aussi votre déclaration de revenus du Québec (TP-1) et remplissez l'annexe D pour le crédit d'impôt pour solidarité."
  "In the last 2 years": "Au cours des 2 dernières années"
  "Including a post-graduation work permit": "Y compris un permis de travail postdiplôme"
  "International student": "Étudiant étranger"
  "International students aren't covered. Use UHIP or your college's health plan. With a work permit and 6 months of full-time work you may qualify later.": "Les étudiants étrangers ne sont pas couverts. Utilisez le RAMU (UHIP) ou le régime de santé de votre collège. Avec un permis de travail et 6 mois de travail à temps plein, vous pourriez y avoir droit plus tard."
  "International students can get a PEI health card for the length of their study permit.": "Les étudiants étrangers peuvent obtenir une carte santé de l'Î.-P.-É. pour la durée de leur permis d'études."
  "International students can't get government student aid or Canada Student Grants.": "Les étudiants étrangers n'ont pas droit à l'aide financière gouvernementale aux études ni aux bourses d'études canadiennes."
  "International students who meet New Brunswick's rules can get Medicare. Check with Medicare.": "Les étudiants étrangers qui respectent les règles du Nouveau-Brunswick peuvent obtenir l'assurance-maladie. Renseignez-vous auprès de l'Assurance-maladie."
  "International students with a study permit of 12 months or more can apply in their 13th month in Nova Scotia.": "Les étudiants étrangers qui ont un permis d'études de 12 mois ou plus peuvent faire la demande à leur 13e mois en Nouvelle-Écosse."
  "International students with a study permit of 12 months or more can usually get AHCIP.": "Les étudiants étrangers qui ont un permis d'études de 12 mois ou plus peuvent habituellement obtenir l'AHCIP."
  "International students with a study permit of 12 months or more for full-time study can get MCP.": "Les étudiants étrangers qui ont un permis d'études de 12 mois ou plus pour des études à temps plein peuvent obtenir le MCP."
  "International students with a study permit of 6 months or more can join MSP. College and university students pay a monthly health fee.": "Les étudiants étrangers qui ont un permis d'études de 6 mois ou plus peuvent adhérer au MSP. Les étudiants du collège et de l'université paient des frais de santé mensuels."
  "It covers you until your provincial health coverage starts.": "Il vous couvre jusqu'au début de votre assurance-maladie provinciale."
  "It depends on your income (or your parents' income if you're a dependent student) and your costs.": "Cela dépend de votre revenu (ou du revenu de vos parents si vous êtes un étudiant à charge) et de vos coûts."
  "It depends on your work income and family; Revenu Québec works it out from your return.": "Cela dépend de votre revenu de travail et de votre famille; Revenu Québec le calcule à partir de votre déclaration."
  "It isn't the government, and it can't apply for you. It doesn't give tax, legal or immigration advice. For help filing, use a free tax clinic. For immigration questions, talk to a licensed consultant or lawyer, or a settlement agency.": "Ce n'est pas le gouvernement, et le site ne peut pas faire de demande pour vous. Il ne donne pas de conseils fiscaux, juridiques ou d'immigration. Pour de l'aide avec votre déclaration, allez à un comptoir d'impôts gratuit. Pour des questions d'immigration, parlez à un consultant autorisé, à un avocat ou à un organisme d'établissement."
  "It lowers the tax you owe this year.": "Il réduit l'impôt que vous devez cette année."
  "It's for citizens, permanent residents and protected persons.": "C'est pour les citoyens, les résidents permanents et les personnes protégées."
  "It's for people aged 18 to 64.": "C'est pour les personnes de 18 à 64 ans."
  "It's for permanent residents, citizens and some others; not study permit holders.": "C'est pour les résidents permanents, les citoyens et quelques autres; pas pour les titulaires d'un permis d'études."
  "Kitchener, Waterloo, Cambridge": "Kitchener, Waterloo, Cambridge"
  "Language": "Langue"
  "Last checked": "Dernière vérification"
  "Last checked {date}.": "Dernière vérification : {date}."
  "Likely": "Probable"
  "London": "London"
  "Manitoba": "Manitoba"
  "Manitoba doesn't cover international students. Your school has a health plan for you.": "Le Manitoba ne couvre pas les étudiants étrangers. Votre établissement a un régime de santé pour vous."
  "Mark your calendar: {name}, {when}.": "Notez dans votre calendrier : {name}, {when}."
  "Maybe": "Possible"
  "Missed a year? You can still file late, and benefits for past years are often paid back.": "Vous avez sauté une année? Vous pouvez encore produire en retard, et les prestations des années passées sont souvent versées rétroactivement."
  "Mississauga or Brampton": "Mississauga ou Brampton"
  "Money you might be missing": "L'argent qui pourrait vous échapper"
  "Money you might get": "L'argent auquel vous pourriez avoir droit"
  "More": "Plus"
  "Most college and university students have a student plan.": "La plupart des étudiants du collège et de l'université ont un régime étudiant."
  "Most newcomers wait up to 3 months after registering. Refugees, protected persons and children don't have to wait.": "La plupart des nouveaux arrivants attendent jusqu'à 3 mois après leur inscription. Les réfugiés, les personnes protégées et les enfants n'ont pas à attendre."
  "New Brunswick": "Nouveau-Brunswick"
  "New benefit year: amounts change": "Nouvelle année de prestations : les montants changent"
  "New citizens can use provincially funded settlement agencies.": "Les nouveaux citoyens peuvent utiliser les organismes d'établissement financés par la province."
  "Newcomers who have settled here permanently can be covered from their first day. Apply as soon as you arrive; processing can take 10 to 12 weeks.": "Les nouveaux arrivants installés ici de façon permanente peuvent être couverts dès leur premier jour. Faites la demande dès votre arrivée; le traitement peut prendre de 10 à 12 semaines."
  "Newfoundland and Labrador": "Terre-Neuve-et-Labrador"
  "Next": "Suivant"
  "No": "Non"
  "No dental plan and income under {amount}: care is covered with a co-pay (you pay 40% or 60%).": "Aucune assurance dentaire et un revenu inférieur à {amount} : les soins sont couverts avec une quote-part (vous payez 40 % ou 60 %)."
  "No dental plan and income under {amount}: care is free.": "Aucune assurance dentaire et un revenu inférieur à {amount} : les soins sont gratuits."
  "Northern Ontario": "Nord de l'Ontario"
  "Not affiliated with the Government of Canada or any province or territory.": "Aucun lien avec le gouvernement du Canada ni avec une province ou un territoire."
  "Not sure": "Je ne suis pas sûr"
  "Not yet": "Pas encore"
  "Not yet, but soon": "Pas encore, mais bientôt"
  "Nova Scotia": "Nouvelle-Écosse"
  "Official page": "Page officielle"
  "On your BC return, claim the BC renter's tax credit.": "Dans votre déclaration de la C.-B., demandez le crédit d'impôt pour locataires de la C.-B."
  "On your Manitoba return, claim the Renters Affordability Tax Credit.": "Dans votre déclaration du Manitoba, demandez le crédit d'impôt pour l'abordabilité des loyers."
  "Only Canadian citizens, permanent residents and protected persons can get it.": "Seuls les citoyens canadiens, les résidents permanents et les personnes protégées y ont droit."
  "Only for some schools in Northern, Eastern and Southwestern Ontario.": "Seulement pour certains établissements du Nord, de l'Est et du Sud-Ouest de l'Ontario."
  "Only if you pay for child care. Keep every receipt.": "Seulement si vous payez des frais de garde. Gardez tous vos reçus."
  "Only if you work full-time for an Ontario employer for at least 6 months. Your partner and children may be covered too.": "Seulement si vous travaillez à temps plein pour un employeur de l'Ontario pendant au moins 6 mois. Votre conjoint et vos enfants pourraient aussi être couverts."
  "Only students from countries with a social security agreement with Quebec (such as France and Belgium) are covered. Others need the school's insurance.": "Seuls les étudiants de pays qui ont une entente de sécurité sociale avec le Québec (comme la France et la Belgique) sont couverts. Les autres ont besoin de l'assurance de leur établissement."
  "Ontario": "Ontario"
  "Ottawa": "Ottawa"
  "Page not found": "Page introuvable"
  "Paid with the Canada Child Benefit.": "Versée avec l'Allocation canadienne pour enfants."
  "Payments start after your 19th birthday. File a tax return now so they start on time.": "Les versements commencent après votre 19e anniversaire. Produisez une déclaration de revenus dès maintenant pour qu'ils commencent à temps."
  "People on a study or work permit can get it from their 19th month in Canada, with a valid permit that month. Apply then with form RC66.": "Les titulaires d'un permis d'études ou de travail y ont droit à partir de leur 19e mois au Canada, avec un permis valide ce mois-là. Faites alors la demande avec le formulaire RC66."
  "People on a study or work permit qualify after {months} months in Canada.": "Les titulaires d'un permis d'études ou de travail y ont droit après {months} mois au Canada."
  "Permanent resident": "Résident permanent"
  "Permanent residents arriving from outside Canada are covered from their first day. Apply right away.": "Les résidents permanents qui arrivent de l'étranger sont couverts dès leur premier jour. Faites la demande tout de suite."
  "Permanent residents can apply from the day they arrive in Manitoba, with proof of status and address.": "Les résidents permanents peuvent faire la demande dès leur arrivée au Manitoba, avec une preuve de statut et d'adresse."
  "Permanent residents can use them (economic-class: for 6 years).": "Les résidents permanents peuvent les utiliser (catégorie économique : pendant 6 ans)."
  "Pick all that fit, or none.": "Choisissez toutes celles qui s'appliquent, ou aucune."
  "Pick the month you arrived, or choose the other answer.": "Choisissez le mois de votre arrivée, ou choisissez l'autre réponse."
  "Plus up to {amount} a month for each child.": "Plus jusqu'à {amount} par mois pour chaque enfant."
  "Prescription drug coverage": "Assurance médicaments"
  "Prince Edward Island": "Île-du-Prince-Édouard"
  "Print or save as PDF": "Imprimer ou enregistrer en PDF"
  "Privacy": "Confidentialité"
  "Private career college": "Collège privé d'enseignement professionnel"
  "Probably not": "Probablement pas"
  "Probably not for you ({count}), and why": "Probablement pas pour vous ({count}), et pourquoi"
  "Program": "Programme"
  "Protected person": "Personne protégée"
  "Quebec": "Québec"
  "Quebec residents who are citizens, permanent residents or protected persons can apply.": "Les résidents du Québec qui sont citoyens, résidents permanents ou personnes protégées peuvent faire une demande."
  "Quebec runs its own student aid (AFE), so the federal grant isn't paid there.": "Le Québec a son propre programme d'aide financière aux études (AFE), alors la bourse fédérale n'y est pas versée."
  "Refugee claimant": "Demandeur d'asile"
  "Refugee claimants are covered automatically.": "Les demandeurs d'asile sont couverts automatiquement."
  "Refugee claimants can't get it until the claim is accepted. Apply as soon as you become a protected person.": "Les demandeurs d'asile n'y ont pas droit avant l'acceptation de leur demande. Faites la demande dès que vous devenez une personne protégée."
  "Refugees and protected persons can use them.": "Les réfugiés et les personnes protégées peuvent les utiliser."
  "Register within 3 months of moving to Alberta. Bring your immigration papers and proof of your Alberta address.": "Inscrivez-vous dans les 3 mois suivant votre arrivée en Alberta. Apportez vos documents d'immigration et une preuve de votre adresse en Alberta."
  "Researchers estimated that working-age people who don't file taxes miss about $1.7 billion in benefits a year. People on study and work permits are much less likely to file than other workers.": "Des chercheurs estiment que les personnes en âge de travailler qui ne produisent pas de déclaration perdent environ 1,7 milliard de dollars en prestations par année. Les titulaires de permis d'études et de travail produisent beaucoup moins souvent leur déclaration que les autres travailleurs."
  "Results pages are marked so browsers don't keep a copy. On a shared computer, close the tab when you're done.": "Les pages de résultats sont marquées pour que les navigateurs n'en gardent pas de copie. Sur un ordinateur partagé, fermez l'onglet quand vous avez terminé."
  "Saskatchewan": "Saskatchewan"
  "Saskatchewan covers international students. Apply for a health card when you arrive.": "La Saskatchewan couvre les étudiants étrangers. Demandez une carte santé à votre arrivée."
  "See my results": "Voir mes résultats"
  "See what you might qualify for, with an estimate where we can work one out from the official formulas.": "Voyez ce à quoi vous pourriez avoir droit, avec une estimation quand les formules officielles le permettent."
  "Since August 1, 2026 most of Ontario's part is a loan; the federal grant is still free money.": "Depuis le 1er août 2026, la plus grande partie de l'aide de l'Ontario est un prêt; la bourse fédérale reste de l'argent gratuit."
  "Since August 1, 2026 most students at for-profit career colleges can't get the full-time grant (some exceptions apply).": "Depuis le 1er août 2026, la plupart des étudiants des collèges privés à but lucratif n'ont plus droit à la bourse à temps plein (avec quelques exceptions)."
  "Single people earning under about {amount} a year can pay $0.": "Les personnes seules qui gagnent moins d'environ {amount} par année peuvent payer 0 $."
  "Skip to content": "Passer au contenu"
  "Some numbers here come from news and tax sites. Check the official page.": "Certains chiffres viennent de médias et de sites fiscaux. Vérifiez la page officielle."
  "Some refugee claimants and work permit holders approved for permanent residence qualify.": "Certains demandeurs d'asile et titulaires de permis de travail approuvés pour la résidence permanente y ont droit."
  "Somewhere else": "Ailleurs"
  "Somewhere else in Ontario": "Ailleurs en Ontario"
  "Start": "Commencer"
  "Student residence": "Résidence étudiante"
  "Students with a disability can get {amount} more.": "Les étudiants ayant un handicap peuvent recevoir {amount} de plus."
  "Study permit": "Permis d'études"
  "Sudbury, Thunder Bay, Sault Ste. Marie, North Bay, Timmins and other towns up north": "Sudbury, Thunder Bay, Sault Ste. Marie, North Bay, Timmins et d'autres villes du Nord"
  "Tax deadline: file your return": "Date limite d'impôt : produisez votre déclaration"
  "That number looks too big or too small.": "Ce nombre semble trop grand ou trop petit."
  "The $0 payment limit depends on your income and family size.": "La limite pour un paiement de 0 $ dépend de votre revenu et de la taille de votre famille."
  "The Canadian Dental Care Plan is open to every age, if you have no dental insurance.": "Le Régime canadien de soins dentaires est ouvert à tous les âges, si vous n'avez pas d'assurance dentaire."
  "The GST/HST credit is now the Canada Groceries and Essentials Benefit, and it's 25% bigger until 2031.": "Le crédit pour la TPS/TVH s'appelle maintenant l'Allocation canadienne pour l'épicerie et les besoins essentiels, et il est 25 % plus élevé jusqu'en 2031."
  "The amount depends on family income; the minimum is $1,221 per child.": "Le montant dépend du revenu familial; le minimum est de 1 221 $ par enfant."
  "The amount depends on the rent or property tax you paid.": "Le montant dépend du loyer ou de l'impôt foncier que vous avez payé."
  "The amount depends on your family income; the CRA works it out.": "Le montant dépend de votre revenu familial; l'ARC le calcule."
  "The calendar file is made on the spot and downloaded to your device. We don't keep it.": "Le fichier de calendrier est créé sur-le-champ et téléchargé sur votre appareil. Nous ne le gardons pas."
  "The exact amount depends on your family income.": "Le montant exact dépend de votre revenu familial."
  "The hydro (electricity) bill is in my name": "La facture d'électricité est à mon nom"
  "The hydro bill is in your name; the limit depends on how many people live with you.": "La facture d'électricité est à votre nom; la limite dépend du nombre de personnes qui vivent avec vous."
  "The link may be old. Start from the home page, or see every benefit we check.": "Le lien est peut-être ancien. Recommencez à la page d'accueil, ou consultez toutes les prestations que nous vérifions."
  "The text font loads from Google Fonts, which sees your IP address like any website you visit.": "La police de caractères est chargée depuis Google Fonts, qui voit votre adresse IP comme tout site que vous visitez."
  "There are no ads, no tracking cookies and no analytics that follow you.": "Il n'y a pas de publicité, pas de témoins de suivi et pas d'outils d'analyse qui vous suivent."
  "There is no waiting period. Apply as soon as you arrive.": "Il n'y a pas de délai d'attente. Faites la demande dès votre arrivée."
  "These are all the programs we check. Each one links to its official page. We re-check amounts every January and July, when most of them change.": "Voici tous les programmes que nous vérifions. Chacun renvoie à sa page officielle. Nous revérifions les montants chaque janvier et chaque juillet, quand la plupart changent."
  "This is a guide, not tax, legal or immigration advice. The government decides who qualifies. Check the official page before you apply.": "Ceci est un guide, pas un conseil fiscal, juridique ou d'immigration. C'est le gouvernement qui décide qui y a droit. Vérifiez la page officielle avant de faire une demande."
  "Toronto": "Toronto"
  "Under 6": "Moins de 6 ans"
  "University or public college": "Université ou collège public"
  "Usually only if your work permit is long enough (often 6 to 12 months or more). Check the rules for your permit.": "Habituellement seulement si votre permis de travail est assez long (souvent 6 à 12 mois ou plus). Vérifiez les règles pour votre permis."
  "Visitor": "Visiteur"
  "Visitors aren't covered. Buy travel health insurance.": "Les visiteurs ne sont pas couverts. Achetez une assurance voyage."
  "Visitors can't get it.": "Les visiteurs n'y ont pas droit."
  "Want to know if you qualify, and what else you might be missing?": "Vous voulez savoir si vous y avez droit, et ce qui d'autre pourrait vous échapper?"
  "Waterloo Region": "Région de Waterloo"
  "We can't find that page": "Nous ne trouvons pas cette page"
  "We couldn't put a dollar amount on anything yet. The list below still shows what to apply for.": "Nous n'avons pas encore pu chiffrer de montant. La liste ci-dessous indique quand même ce qu'il faut demander."
  "We don't save your answers.": "Nous ne gardons pas vos réponses."
  "We don't save your answers. They're used once to build your results page.": "Nous ne gardons pas vos réponses. Elles servent une seule fois à créer votre page de résultats."
  "We never ask for your name, address, email or Social Insurance Number.": "Nous ne demandons jamais votre nom, votre adresse, votre courriel ni votre numéro d'assurance sociale."
  "We use the official formulas published by the Canada Revenue Agency, the provinces and the territories, and test them against the government's own numbers. Where a program has no simple formula, we show the most it pays, or no amount.": "Nous utilisons les formules officielles publiées par l'Agence du revenu du Canada, les provinces et les territoires, et nous les testons avec les chiffres du gouvernement. Quand un programme n'a pas de formule simple, nous indiquons le montant maximal, ou aucun montant."
  "What changed in 2026": "Ce qui a changé en 2026"
  "What kind of school?": "Quel type d'établissement?"
