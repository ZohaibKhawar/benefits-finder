  "Your share of the rent each month": "Votre part du loyer chaque mois"
  "about {amount} a year": "environ {amount} par année"
  "after the Disability Tax Credit is approved": "après l'approbation du crédit d'impôt pour personnes handicapées"
  "after you file your tax return": "après avoir produit votre déclaration de revenus"
  "after you turn 18": "à partir de vos 18 ans"
  "after you turn 19": "à partir de vos 19 ans"
  "after you turn {age}": "à partir de vos {age} ans"
