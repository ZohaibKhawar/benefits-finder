    entrance:
      url: https://algomau.ca/students/tuition-scholarships-financial-aid/awards-scholarships/entrance-scholarships/
      tiers:
        - {min: 95, first_year: 4000, total: 16000}
        - {min: 90, first_year: 3000, total: 12000}
        - {min: 85, first_year: 2500, total: 10000}
        - {min: 80, first_year: 1500, total: 6000}
      note: Renewable for up to 3 more years, at the level your university average reaches.
    last_checked: 2026-10-25

