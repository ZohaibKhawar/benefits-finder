# Ontario's public universities and colleges, for the scholarships and bursaries finder.
# Every link goes to the school's own awards or financial aid page, on the school's own domain
# (tests/test_awards.py checks that). Entrance scholarships are only the automatic ones that every
# student coming straight from high school gets at a given average; anything you apply for is on the
# school's page instead.
#
# entrance.tiers: final admission average (top 6 Grade 12 U/M courses) -> dollars, highest first.
#   first_year is paid in first year; total is the most over the whole degree if you keep renewing it.
# entrance.min: used instead of tiers when the school publishes a cut-off but no amounts.
# entrance.statuses: who it's for; left out means citizens, permanent residents and protected persons.
# Sources and dates: research/06-student-awards.md

schools:

